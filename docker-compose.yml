version: '3.8'

# network_mode: host → Postgres en 127.0.0.1:5432 (sin host.docker.internal)

services:
  renace-forms-app:
    image: talentolink:latest
    container_name: renace-forms-app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - ECOFAST_BASE=/var/www/ecofast
      - PORT=${RENACE_FORMS_PORT:-3010}
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL_MIGRATE}
    volumes:
      - renace-forms_uploads:/app/public/uploads
      - /var/www/ecofast/tenants:/var/www/ecofast/tenants:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  renace-forms_uploads:
