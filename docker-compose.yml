version: '3.8'

# forms.renace.tech — Nginx en el host hace proxy a 127.0.0.1:3010

services:
  renace-forms-app:
    image: talentolink:latest
    container_name: renace-forms-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RENACE_FORMS_PORT:-3010}:3000"
    env_file:
      - .env
    environment:
      - ECOFAST_BASE=/var/www/ecofast
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - renace-forms_uploads:/app/public/uploads
      - /var/www/ecofast/tenants:/var/www/ecofast/tenants:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  renace-forms_uploads:
