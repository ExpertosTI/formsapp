version: '3.8'

services:
  talentolink-app:
    image: talentolink:latest
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - RenaceNet
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://catagce.renace.tech}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.talentolink-secure.rule=Host(`catagce.renace.tech`)"
        - "traefik.http.routers.talentolink-secure.entrypoints=websecure"
        - "traefik.http.routers.talentolink-secure.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.talentolink-app.loadbalancer.server.port=3000"
        - "traefik.http.routers.talentolink-http.rule=Host(`catagce.renace.tech`)"
        - "traefik.http.routers.talentolink-http.entrypoints=web"
        - "traefik.http.routers.talentolink-http.middlewares=https-redirect"
        - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
    volumes:
      - talentolink_uploads:/app/public/uploads
      - ./migration_backup:/app/migration_backup:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  talentolink_uploads:
    external: false

networks:
  RenaceNet:
    external: true
