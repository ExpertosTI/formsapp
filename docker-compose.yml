version: '3.8'

# network_mode: host → Postgres en 127.0.0.1:5432

services:
  renace-forms-app:
    image: talentolink:latest
    container_name: renace-forms-app
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - ECOFAST_BASE=/var/www/ecofast
      - PORT=${RENACE_FORMS_PORT:-3010}
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL_MIGRATE}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://forms.renace.tech}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-https://evoapi.renace.tech}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVO_API_URL=${EVO_API_URL:-}
      - EVO_API_KEY=${EVO_API_KEY:-}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL:-}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:-}
    volumes:
      - renace-forms_uploads:/app/public/uploads
      - /var/www/ecofast/tenants:/var/www/ecofast/tenants:ro
      - ./.evolution.local:/app/.evolution.local:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  renace-forms_uploads:
