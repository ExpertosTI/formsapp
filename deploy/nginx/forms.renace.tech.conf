# Nginx → TalentoLink (Docker en 127.0.0.1:__PORT__)
# Instalado por scripts/setup-nginx.sh

upstream talentolink_forms {
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name forms.renace.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forms.renace.tech;

    ssl_certificate /etc/letsencrypt/live/forms.renace.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forms.renace.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://talentolink_forms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
